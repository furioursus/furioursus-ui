<!doctype html>
<!-- The built Vue components (dist/vue/). Serve the repo root and open /demo/components.html. -->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#e8e3e2">
	<script src="../dist/theme.js"></script>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
	<link rel="stylesheet" href="../dist/tokens.css">
	<link rel="stylesheet" href="../dist/base.css">
	<link rel="stylesheet" href="../dist/vue/style.css">
	<script type="importmap">{ "imports": { "vue": "../node_modules/vue/dist/vue.esm-browser.prod.js" } }</script>
	<title>@furioursus/ui components</title>
	<style>
		body { margin: 0 auto; max-width: var(--container-wide); padding: var(--spacing-gutter-sm) var(--spacing-gutter); font-size: 1.125rem; line-height: 1.75rem; }
		h1, h2 { color: var(--color-heading); font-family: var(--font-display); font-variation-settings: var(--font-display--font-variation-settings); letter-spacing: var(--tracking-display); }
		h1 { font-size: var(--text-title-lg); line-height: var(--text-title-lg--line-height); margin: 0; }
		h2 { font-size: var(--text-card-title); line-height: var(--text-card-title--line-height); margin: 2.5rem 0 0.25rem; }
		.note { color: var(--color-muted); font-size: 0.875rem; margin: 0 0 1rem; }
		.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1rem; }
		.cell { border: 1px dashed var(--color-muted); border-radius: var(--radius-sm); padding: 1rem; }
		.cell h3 { margin: 0 0 0.75rem; font-size: 0.75rem; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-muted); font-weight: 400; }
		.row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
		.lists { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
		.panel { margin-top: 0.75rem; font-size: 0.875rem; color: var(--color-muted); }
	</style>
</head>
<body>
	<div id="app"></div>
	<script type="module">
		import { createApp, h, ref } from "vue";
		import { PeriodTabs, RankedList, ThemeToggle } from "../dist/vue/index.js";

		const periods = [
			{ value: "7day", label: "Last 7 days" },
			{ value: "1month", label: "Last month" },
			{ value: "3month", label: "Last 3 months" },
			{ value: "12month", label: "Last year" },
			{ value: "overall", label: "All time" },
		];
		const ranges = [
			{ value: "1w", label: "1W" }, { value: "1m", label: "1M" }, { value: "3m", label: "3M" },
			{ value: "1y", label: "1Y" }, { value: "all", label: "All" },
		];
		const artists = [{ name: "Massive Attack", count: 1204, url: "#" }, { name: "Portishead", count: 986, url: "#" }, { name: "Tricky", count: 744, url: "#" }];
		const albums = [
			{ name: "Blue Lines", subtitle: "Massive Attack", count: 1204, url: "#" },
			{ name: "Dummy", subtitle: "Portishead", count: 986, url: "#" },
			{ name: "Maxinquaye: a long title that has to truncate", subtitle: "Tricky", count: 744 },
		];

		const cell = (title, ...children) => h("div", { class: "cell" }, [h("h3", title), ...children]);

		createApp({
			setup() {
				const a = ref("7day");
				const b = ref("1m");
				return () => [
					h("h1", "Components"),
					h("p", { class: "note" }, "Built from dist/vue/. Run npm run build after changing a component."),

					h("h2", "ThemeToggle"),
					h("p", { class: "note" }, "A switch; sends theme-change to theme.js and follows theme-changed."),
					h("div", { class: "row" }, [h(ThemeToggle)]),

					h("h2", "PeriodTabs"),
					h("p", { class: "note" }, "ARIA tabs: arrow keys wrap, Home and End jump, only the selected tab is in the Tab order."),
					h("div", { class: "compare" }, [
						cell("Listening stats",
							h(PeriodTabs, { options: periods, label: "Time range", modelValue: a.value, "onUpdate:modelValue": (v) => (a.value = v) }),
							h("p", { class: "panel" }, `Showing ${a.value}`)),
						cell("Chart range",
							h(PeriodTabs, { options: ranges, label: "Date range", modelValue: b.value, "onUpdate:modelValue": (v) => (b.value = v) }),
							h("p", { class: "panel" }, `Showing ${b.value}`)),
					]),

					h("h2", "RankedList"),
					h("p", { class: "note" }, "Rows reserve two lines, so lists with and without subtitles line up."),
					h("div", { class: "lists" }, [
						h(RankedList, { title: "Top Artists", items: artists }),
						h(RankedList, { title: "Top Albums", items: albums }),
						h(RankedList, { title: "Top Tracks", items: [], emptyText: "Nothing scrobbled in this range yet." }),
					]),
				];
			},
		}).mount("#app");
	</script>
</body>
</html>
